# ═══════ NullBot 基础配置文件 ═══════ #
# 基础固定配置.                        #
# ══════════════════════════════════ #

spring:
  application:
    name: NullBot-renewal
  profiles:
    active: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/${nullbot.mysql.database}
    username: ${nullbot.mysql.username}
    password: ${nullbot.mysql.password}

springdoc:
  api-docs:
    enabled: ${nullbot.doc.enabled:false}

logging:
  file:
    name: ${nullbot.log.path:./output.log}
  level:
    root: INFO
    com.zincoid: ${nullbot.log.level:INFO}
  pattern:
    console: >-
      %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}
      %highlight(%5p)
      %clr([%15.15t]){faint}
      %clr(%-36.36logger{36}){cyan}
      %clr(:){faint}
      %m%n%wEx
    file: >-
      %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}
      %highlight(%5p)
      %clr([%15.15t]){faint}
      %clr(%-36.36logger{36}){cyan}
      %clr(:){faint}
      %m%n%wEx

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

shiro:
  ws:
    server:
      enable: true
      url: ${nullbot.shiro.url}
    access-token: ${nullbot.shiro.token}

bot:
  adapter: ${nullbot.adapter:stdin}
