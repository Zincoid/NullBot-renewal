# ═══════ NullBot 基础配置文件 ═══════ #
# 基础固定配置.                        #
# ══════════════════════════════════ #

server:
  port: ${nullbot.port:0}

spring:
  application:
    name: NullBot-renewal
  profiles:
    active: prod
  config:
    import: optional:classpath:adapter.yaml
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      resolve-lazily: true
      max-file-size: 256MB
      max-request-size: 512MB

springdoc:
  api-docs:
    enabled: ${nullbot.docs.enabled:false}

logging:
  file:
    name: ${nullbot.log.path:./logs/output.log}
  level:
    root: WARN
    com.zincoid: ${nullbot.log.level:INFO}
  pattern:
    console: >-
      %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}
      %highlight(%5p)
      %clr([%15.15t]){faint}
      %clr(%-36.36logger{36}){cyan}
      %clr(:){faint}
      %m%n%wEx
    file: >-
      %d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}
      %5p
      [%15.15t]
      %-36.36logger{36}
      :
      %m%n%wEx

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml

bot:
  db:
    type: ${nullbot.db.type:sqlite}
    mysql:
      host: ${nullbot.db.mysql.host:localhost}
      port: ${nullbot.db.mysql.port:3306}
      database: ${nullbot.db.mysql.database:}
      username: ${nullbot.db.mysql.username:}
      password: ${nullbot.db.mysql.password:}
    sqlite:
      path: ${nullbot.db.sqlite.path:./data/sqlite.db}
  file:
    root: ${nullbot.file.root:./files}
  console:
    token: ${nullbot.console.token:}
  cmd:
    ignore-case: true
  plugin:
    enabled: ${nullbot.plugin.enabled:false}
    dir: ${nullbot.plugin.dir:./plugins}
